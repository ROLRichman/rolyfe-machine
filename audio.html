<audio id="player"></audio>

<button onclick="startMusic()">▶ Start Deal Room</button>

<script>
const tracks = [
  "https://workdrive.zohoexternal.com/file/xxxxx?directDownload=true",
  "https://workdrive.zohoexternal.com/file/yyyyy?directDownload=true",
  "https://workdrive.zohoexternal.com/file/zzzzz?directDownload=true"
];

let current = 0;
const player = document.getElementById("player");

function playTrack(index){
  player.src = tracks[index];
  player.play();
}

player.addEventListener("ended", () => {
  current = (current + 1) % tracks.length;
  playTrack(current);
});

function startMusic(){
  playTrack(current);
}
</script>
